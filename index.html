        :root{
            --accent:#7BBDE8;
            --ink:#EAF4FF; --muted:#B9C6E8; --faint:#7E86B4;
            --card:rgba(14,10,34,0.22); --line:rgba(255,255,255,0.12);
            --pill:rgba(255,255,255,0.06); --pill-line:rgba(255,255,255,0.10);
            --glow:rgba(255,244,190,0.55);
            /* 全站統一字體（含英文），以「US ENGLISH」的圓體為準 */
            --font:"Google Sans Flex","Noto Sans TC",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
        }
        *{ margin:0; padding:0; box-sizing:border-box; }
        /* 連結/按鈕/表單預設不繼承字體，這裡強制統一，避免英文出現不同字體 */
        body, a, button, input, textarea, select{ font-family:var(--font); }
        html,body{ height:100%; }
        body{
            font-family:var(--font);
            -webkit-font-smoothing:antialiased;
            min-height:100vh; color:var(--ink);
            /* 星空素材圖 + 黑→深紫漸層疊層（漸層柔化照片、加深夜色，任何比例都不失真感） */
            background:
                linear-gradient(180deg, rgba(3,2,9,0.40) 0%, rgba(10,6,26,0.32) 46%, rgba(20,12,50,0.46) 100%),
                #03020a url('assets/bg.jpg') center center / cover no-repeat;
            background-attachment:fixed;
            display:flex; align-items:center; justify-content:center; padding:24px;
            overflow-x:hidden;
        }
        /* 動畫層（星雲＋閃爍星星＋流星＋夜色雲朵） */
        #sky{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

        /* 月亮素材圖＋淡黃光暈 */
        .moon{ position:fixed; top:5vh; right:6vw; width:min(180px,26vw); z-index:0; pointer-events:none;
               filter:drop-shadow(0 0 34px var(--glow)); }
        .moon img{ width:100%; display:block; }
        /* 光暈：更大、falloff 更漸進，再加 blur 讓最外圍完全糊掉、無銳利邊 */
        .moon::before{ content:''; position:absolute; inset:-95%; z-index:-1; border-radius:50%;
            background:radial-gradient(circle,
                rgba(255,247,205,0.36) 0%,
                rgba(255,243,185,0.18) 26%,
                rgba(255,240,175,0.07) 48%,
                rgba(255,240,175,0.02) 66%,
                transparent 82%);
            filter:blur(26px);
            animation:moonGlow 6s ease-in-out infinite; }
        @keyframes moonGlow{ 0%,100%{opacity:.82; transform:scale(1);} 50%{opacity:1; transform:scale(1.07);} }

        .container{
            position:relative; z-index:1; overflow:hidden;
            /* glossy 玻璃：半透明底＋上半部反光漸層（收斂版，大面積不宜太亮） */
            background:linear-gradient(to bottom, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 42%), var(--card);
            backdrop-filter:blur(11px) saturate(1.5);
            -webkit-backdrop-filter:blur(11px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.20);
            border-radius:26px; padding:44px 40px;
            max-width:600px; width:100%; text-align:center;
            box-shadow:0 24px 70px rgba(4,2,16,0.6),
                       inset 0 1px 1px rgba(255,255,255,0.22),
                       inset 0 14px 30px rgba(255,255,255,0.05),
                       inset 0 -22px 44px rgba(0,0,0,0.08);
            transform-style:preserve-3d; will-change:transform;
            transition:transform .18s ease-out, box-shadow .4s ease, border-color .4s ease;
        }
        /* 跟著游標的「邊框光」：只在邊框環上發亮，不是整片底（gradient-border + mask 技巧） */
        .container::after{
            content:''; position:absolute; inset:0; z-index:2; pointer-events:none; border-radius:inherit;
            padding:1px;
            background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),
                       rgba(233,224,255,0.95), rgba(178,150,255,0.34) 42%, transparent 66%);
            -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite:exclude;
            opacity:0; transition:opacity .4s ease;
        }
        .container > *{ position:relative; z-index:1; }
        .container:hover{
            border-color:rgba(190,175,240,0.28);
            box-shadow:0 40px 100px rgba(2,6,22,0.72),
                       inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .container:hover::after{ opacity:1; }
        .logo{
            width:84px; height:84px; margin:0 auto 20px; display:block;
            border-radius:22px; border:1px solid rgb(64,24,251);
            box-shadow:0 10px 30px rgba(4,2,16,0.55), 0 0 24px rgba(123,189,232,0.25);
        }
        h1{ font-size:30px; font-weight:800; letter-spacing:.01em; margin-bottom:8px; text-wrap:balance;
            animation:titleBreath 4.5s ease-in-out infinite; }
        @keyframes titleBreath{
            0%,100%{ text-shadow:0 2px 12px rgba(123,189,232,0.22), 0 0 16px rgba(123,189,232,0.12); }
            50%{ text-shadow:0 2px 22px rgba(123,189,232,0.55), 0 0 34px rgba(150,205,255,0.45); }
        }
        .subtitle{ color:var(--muted); margin-bottom:24px; line-height:1.7; font-size:15.5px; font-weight:500; }

        .download{
            display:inline-flex; align-items:center; justify-content:center; gap:10px;
            margin:0 auto 30px; padding:15px 30px;
            background:linear-gradient(180deg,#FFB13C 0%,#FFCB46 55%,#FFE072 100%);
            color:#3A2600; text-decoration:none; font-weight:800; font-size:16.5px;
            border-radius:16px; box-shadow:0 6px 22px rgba(255,168,60,0.40), inset 0 1px 0 rgba(255,255,255,0.5);
            transition:transform .18s ease, box-shadow .18s ease;
        }
        /* 光暈置中不下偏：y 位移小、加 spread 讓四周均勻發光 */
        .download:hover{ transform:translateY(-2px); box-shadow:0 2px 30px 4px rgba(255,168,60,0.55), inset 0 1px 0 rgba(255,255,255,0.5); }
        .download:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

        .links{ display:flex; flex-direction:column; gap:12px; }

        .lang-section + .lang-section{ margin-top:12px; }   /* 開源按鈕與上方英文列留間距 */
        /* 淡色文字加深色描邊：深背景上看不出、飄到亮雲上時提供對比，字始終清楚 */
        .lang-title{ font-size:12.5px; color:var(--faint); margin:20px 0 12px; text-transform:uppercase; letter-spacing:.14em; font-weight:700;
                     text-shadow:0 1px 3px rgba(2,4,12,0.9), 0 0 8px rgba(2,4,12,0.6); }
        .footer span{ font-size:12.5px; color:var(--faint); text-transform:uppercase; font-weight:700; letter-spacing:.08em;
                      text-shadow:0 1px 3px rgba(2,4,12,0.9), 0 0 8px rgba(2,4,12,0.6); }
        .link{
            flex:1; display:block; padding:15px 20px;
            background:var(--pill); border:1px solid var(--pill-line);
            border-radius:14px; color:var(--ink); text-decoration:none;
            font-weight:600; font-size:15px;
            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);

        }
        .link .lico{ width:20px; height:20px; vertical-align:-5px; margin-right:8px; }
        /* liquid glass hover：半透明玻璃亮起＋亮邊高光＋毛玻璃折射（文字維持亮色，不變實心底） */
        .link:hover{
            /* pure-css glossy：半透明底＋上半部反光漸層（取代會蓋字的 ::before），內反光收斂 */
            background:linear-gradient(to bottom, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 55%), rgba(255,255,255,0.10);
            border-color:rgba(255,255,255,0.28);
            transform:translateY(-2px);
            box-shadow:0 20px 40px rgba(0,0,0,0.15),
                       inset 0 1px 1px rgba(255,255,255,0.32),
                       inset 0 8px 18px rgba(255,255,255,0.12),
                       inset 0 -15px 30px rgba(0,0,0,0.06);
            backdrop-filter:blur(12px) saturate(180%);
            -webkit-backdrop-filter:blur(12px) saturate(180%);
        }
        .link:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

        /* 四顆快速連結：一行四個、上圖下字（手機一行兩個） */

            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);

        }
        .qlink img{ width:32px; height:32px; display:block; }
        .qlink:hover{
            background:linear-gradient(to bottom, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 55%), rgba(255,255,255,0.10);
            border-color:rgba(255,255,255,0.28); transform:translateY(-2px);
            box-shadow:0 20px 40px rgba(0,0,0,0.15),
                       inset 0 1px 1px rgba(255,255,255,0.32),
                       inset 0 8px 18px rgba(255,255,255,0.12),
                       inset 0 -15px 30px rgba(0,0,0,0.06);
            backdrop-filter:blur(12px) saturate(180%); -webkit-backdrop-filter:blur(12px) saturate(180%);
        }
        .qlink:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
        .divider{ height:1px; background:var(--line); margin:26px 0 0; }
        .footer{ margin-top:26px; display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px;
                 color:var(--faint); font-size:13.5px; }
        /* 右上角圓形客服按鈕（liquid glass 底） */
        .contact-fab{ position:absolute; top:16px; right:16px; z-index:3;
            width:48px; height:48px; border-radius:50%;
            display:inline-flex; align-items:center; justify-content:center;
            background:var(--pill); border:1px solid rgba(255,255,255,0.08);
            backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
            transition:transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease, backdrop-filter .22s ease; }
        .contact-fab img{ width:26px; height:26px; display:block; }
        .contact-fab:hover{
            background:linear-gradient(to bottom, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 55%), rgba(255,255,255,0.10);
            border-color:rgba(255,255,255,0.28); transform:translateY(-2px);
            box-shadow:0 20px 40px rgba(0,0,0,0.15),
                       inset 0 1px 1px rgba(255,255,255,0.32),
                       inset 0 7px 14px rgba(255,255,255,0.12),
                       inset 0 -12px 22px rgba(0,0,0,0.06);
            backdrop-filter:blur(12px) saturate(180%); -webkit-backdrop-filter:blur(12px) saturate(180%); }
        .contact-fab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
        .contact-btn .lico{ width:18px; height:18px; vertical-align:middle; }

        .cbody{ min-height:0; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.22) transparent; }
        .cbody::-webkit-scrollbar{ width:8px; }
        .cbody::-webkit-scrollbar-track{ background:transparent; margin:6px 0; }
        .cbody::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:99px;
            border:2px solid transparent; background-clip:padding-box; }
        .cbody::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,0.34); background-clip:padding-box; }
        @media (max-width:520px){
            body{ padding:16px; }
            /* 卡片不超出畫面，改由內層 .cbody 捲動；客服鈕與邊框光維持固定 */
            .container{ padding:30px 20px; border-radius:22px; display:flex; flex-direction:column; max-height:calc(100dvh - 32px); }
            .cbody{ overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1 1 auto; }
            .quicklinks{ grid-template-columns:repeat(2, 1fr); }
            .link-row{ flex-direction:column; }

            .moon{ width:34vw; top:3vh; }
        }
        @media (prefers-reduced-motion:reduce){
            .link,.download,.container,.qlink{ transition:none; }
            .container:hover{ transform:none; }
            .moon::before, h1{ animation:none; }
        }

</head>
<body>

    <script>
    (function(){
        const canvas = document.getElementById('sky');
        const ctx = canvas.getContext('2d');
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const moonEl = document.querySelector('.moon');
        // 月亮隨機模糊 0~2px（兩個不同頻率 sin 疊出平滑擬隨機），保留黃色光暈
        function updateMoonBlur(t){
            if (!moonEl) return;
            let b = 1 + Math.sin(t * 0.5) * 0.6 + Math.sin(t * 0.23 + 1.3) * 0.45;
            b = Math.max(0, Math.min(2, b));
            moonEl.style.filter = 'drop-shadow(0 0 34px rgba(255,244,190,0.55)) blur(' + b.toFixed(2) + 'px)';
        }
        let W = 0, H = 0, DPR = 1;
        let stars = [], meteors = [], clouds = [], nebulaLayer = null, starSprite = null;

        function hexA(hex, a){
            const n = parseInt(hex.slice(1), 16);
            return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
        }
        // 一顆「模糊發光星」預繪成 sprite：之後只縮放/改透明度貼上，省掉每幀 filter/漸層
        function makeStarSprite(){
            const S = 46, c = S / 2;
            const oc = document.createElement('canvas'); oc.width = S; oc.height = S;
            const x = oc.getContext('2d');
            const g = x.createRadialGradient(c, c, 0, c, c, c);
            g.addColorStop(0, 'rgba(212,226,255,0.5)');
            g.addColorStop(0.5, 'rgba(212,226,255,0.12)');
            g.addColorStop(1, 'rgba(212,226,255,0)');
            x.fillStyle = g; x.beginPath(); x.arc(c, c, c, 0, Math.PI*2); x.fill();
            x.filter = 'blur(1.1px)';
            x.fillStyle = 'rgba(255,255,255,0.95)';
            x.beginPath();
            const pts = 8, R = c * 0.42, inner = R * 0.34;
            for (let i = 0; i < pts*2; i++){
                const rr = (i%2===0) ? R : inner;
                const a = i * Math.PI / pts - Math.PI/2;
                const px = c + Math.cos(a)*rr, py = c + Math.sin(a)*rr;
                i===0 ? x.moveTo(px,py) : x.lineTo(px,py);
            }
            x.closePath(); x.fill(); x.filter = 'none';
            return oc;
        }
        // 深紫星雲：預繪成一張離屏，之後每幀只 drawImage（不再每幀重算 6 個大漸層）
        function buildNebula(){
            const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
            const x = oc.getContext('2d');
            const cols = ['#3A1D6E', '#2A1458', '#4A2170', '#1E1246'];
            for (let i = 0; i < 6; i++){
                const cx = Math.random()*W, cy = Math.random()*H*0.9, R = (0.25+Math.random()*0.35)*Math.max(W,H);
                const op = 0.06 + Math.random()*0.16, col = cols[Math.floor(Math.random()*cols.length)];
                const g = x.createRadialGradient(cx, cy, 0, cx, cy, R);
                g.addColorStop(0, hexA(col, op)); g.addColorStop(0.55, hexA(col, op*0.4)); g.addColorStop(1, hexA(col, 0));
                x.fillStyle = g; x.fillRect(cx-R, cy-R, R*2, R*2);
            }
            return oc;
        }

        // ---- 夜色雲朵 sprite：偏藍紫、非純白；離屏預繪，足夠內距避免邊緣被裁成直線 ----
        function makeCloudSprite(scale){
            const cw = 300 * scale, ch = 150 * scale;
            const pad = 90 * scale;
            const W0 = Math.round(cw + pad * 2), H0 = Math.round(ch + pad * 2);
            const oc = document.createElement('canvas');
            oc.width = W0; oc.height = H0;
            const x = oc.getContext('2d');
            const cy = pad + ch * 0.55;
            const puffs = [];
            const n = 6;
            for (let i = 0; i < n; i++){
                const f = i / (n - 1);
                const px = pad + cw * (0.10 + 0.80 * f) + (Math.random()*2-1) * cw * 0.03;
                const py = cy - Math.abs(f - 0.5) * ch * 0.16 + (Math.random()*2-1) * ch * 0.04;
                const r  = ch * (0.30 + Math.random() * 0.14);
                puffs.push([px, py, r]);
            }
            for (let i = 0; i < 3; i++){
                const px = pad + cw * (0.28 + 0.44 * Math.random());
                const py = cy - ch * (0.22 + Math.random() * 0.16);
                const r  = ch * (0.24 + Math.random() * 0.13);
                puffs.push([px, py, r]);
            }
            x.filter = 'blur(' + (scale * 2.2) + 'px)';
            for (const [px, py, r] of puffs){
                const g = x.createRadialGradient(px, py - r * 0.18, r * 0.15, px, py, r);
                // 夜色雲：微涼的藍紫白，非純白
                g.addColorStop(0, 'rgba(202,210,242,0.86)');
                g.addColorStop(0.52, 'rgba(158,166,212,0.50)');
                g.addColorStop(0.82, 'rgba(150,158,205,0.18)');
                g.addColorStop(1, 'rgba(150,158,205,0)');
                x.fillStyle = g;
                x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fill();
            }
            x.filter = 'none';
            x.globalCompositeOperation = 'source-atop';
            // 下腹：深紫夜影
            const belly = x.createLinearGradient(0, cy - ch * 0.12, 0, cy + ch * 0.55);
            belly.addColorStop(0, 'rgba(26,14,58,0)');
            belly.addColorStop(1, 'rgba(14,7,36,0.50)');
            x.fillStyle = belly; x.fillRect(0, 0, W0, H0);
            // 上緣：淡藍月光高光
            const top = x.createLinearGradient(0, pad * 0.4, 0, cy);
            top.addColorStop(0, 'rgba(190,205,255,0.26)');
            top.addColorStop(1, 'rgba(190,205,255,0)');
            x.fillStyle = top; x.fillRect(0, 0, W0, H0);
            x.globalCompositeOperation = 'source-over';
            return oc;
        }

        function rebuild(){
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * DPR; canvas.height = H * DPR;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

            // 星雲（預繪一張離屏）、星星 sprite（預繪一次）
            starSprite = starSprite || makeStarSprite();
            nebulaLayer = buildNebula();

            // 閃爍星星（改用 sprite，之後只縮放/改透明度貼上）
            const starCount = Math.round(40 * Math.sqrt((W * H) / (430 * 932)));
            stars = Array.from({length: starCount}, () => ({
                x: Math.random() * W,
                y: Math.random() * H * 0.62,
                phase: Math.random() * Math.PI * 2,
                speed: 0.7 + Math.random() * 1.4,
                size: 3 + Math.random() * 5           // sprite 半徑（px）
            }));

            // 流星
            meteors = Array.from({length: 4}, () => {
                const th = (25 + Math.random() * 15) * Math.PI / 180;
                return { sx: 0.45 + Math.random()*0.6, sy: -0.05 + Math.random()*0.4,
                         dx: -Math.cos(th), dy: Math.sin(th),
                         len: 0.30 + Math.random()*0.22, period: 7 + Math.random()*8,
                         phase: Math.random(), size: 0.8 + Math.random()*0.8 };
            });

            // 夜色雲朵
            const cloudN = Math.max(4, Math.round(5 * Math.sqrt(W / 900)));
            clouds = [];
            for (let i = 0; i < cloudN; i++){
                const depth = Math.random();
                const scale = (0.85 + depth * 1.25) * Math.max(0.75, W / 1050);   // 更大
                const sprite = makeCloudSprite(scale);
                clouds.push({
                    sprite, hw: sprite.width / 2,
                    y: H * (0.78 + Math.random() * 0.20),                           // 壓低到畫面下方
                    x: Math.random() * (W + sprite.width) - sprite.width / 2,
                    speed: 6 + depth * 15,
                    bob: Math.random() * Math.PI * 2,
                    opacity: 0.38 + depth * 0.32                                    // 濃度收斂一點
                });
            }
        }

        function drawStars(t){
            for (const s of stars){
                const tw = (Math.sin(t * s.speed + s.phase) + 1) / 2;
                const sz = s.size * (0.7 + 0.6 * tw);
                ctx.globalAlpha = 0.22 + 0.6 * tw;
                ctx.drawImage(starSprite, s.x - sz, s.y - sz, sz * 2, sz * 2);
            }
            ctx.globalAlpha = 1;
        }

        function drawMeteors(t){
            const minD = Math.min(W, H), vis = 0.09;
            for (const m of meteors){
                let u = ((t / m.period + m.phase) % 1 + 1) % 1;
                if (u >= vis) continue;
                const p = u / vis, env = Math.sin(p * Math.PI);
                const travel = p * m.len * minD;
                const hx = m.sx * W + m.dx * travel, hy = m.sy * H + m.dy * travel;
                const tail = 0.11 * minD * m.size * (0.6 + 0.4 * env);
                const tx = hx - m.dx * tail, ty = hy - m.dy * tail;
                const grad = ctx.createLinearGradient(tx, ty, hx, hy);
                grad.addColorStop(0, 'rgba(255,255,255,0)');
                grad.addColorStop(1, 'rgba(255,255,255,' + (0.9 * env) + ')');
                ctx.strokeStyle = grad; ctx.lineWidth = 1.4 * m.size; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,' + env + ')';
                ctx.beginPath(); ctx.arc(hx, hy, 1.5 * m.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function drawClouds(t){
            for (const c of clouds){
                const span = W + c.sprite.width;
                const x = (((c.x + c.speed * t) % span) + span) % span - c.sprite.width / 2;
                const y = c.y + Math.sin(t * 0.25 + c.bob) * 10;
                ctx.globalAlpha = c.opacity;
                ctx.drawImage(c.sprite, x - c.hw, y - c.sprite.height / 2);
            }
            ctx.globalAlpha = 1;
        }

        // 淡色文字（英/開源標題、版權）：雲飄到底下時切深色
        let dimTargets = [];
        function refreshTargets(){ dimTargets = Array.from(document.querySelectorAll('.lang-title, .footer > span')); }
        function checkClouds(t){
            if (!dimTargets.length) return;
            for (const el of dimTargets){
                const r = el.getBoundingClientRect();
                let lit = false;
                for (const c of clouds){
                    const span = W + c.sprite.width;
                    const cx = (((c.x + c.speed * t) % span) + span) % span - c.sprite.width / 2;
                    const cy = c.y + Math.sin(t * 0.25 + c.bob) * 10;
                    const hw = c.sprite.width * 0.34, hh = c.sprite.height * 0.28;
                    if (cx + hw > r.left && cx - hw < r.right && cy + hh > r.top && cy - hh < r.bottom){ lit = true; break; }
                }
                el.classList.toggle('on-cloud', lit);
            }
        }

        let fc = 0;
        function frame(now){
            const t = now / 1000;
            ctx.clearRect(0, 0, W, H);
            if (nebulaLayer) ctx.drawImage(nebulaLayer, 0, 0, W, H);
            drawStars(t);
            drawMeteors(t);
            drawClouds(t);
            if ((fc++ % 8) === 0) checkClouds(t);   // 每 8 幀偵測一次，省效能
            if ((fc % 5) === 0) updateMoonBlur(t);  // 月亮模糊平滑更新
            if (!reduce) raf = requestAnimationFrame(frame);
        }

        let raf = null;
        function start(){ if (raf) cancelAnimationFrame(raf); rebuild(); refreshTargets(); if (reduce){ frame(0); } else { raf = requestAnimationFrame(frame); } }

        let rt;
        window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(start, 180); });
        start();
    })();

    // 卡片：邊框柔光跟游標 ＋ 2.5D 傾斜（hover 左上→左上翹起、右下凹陷）
    (function(){
        const card = document.querySelector('.container');
        if (!card) return;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const MAX = 4;           // 最大傾斜角（度，收斂更細膩）
        let pending = null, ticking = false;
        function apply(){
            ticking = false;
            if (!pending) return;
            const { mx, my, w, h } = pending;
            card.style.setProperty('--mx', mx + 'px');
            card.style.setProperty('--my', my + 'px');
            if (!reduceMotion){
                const rotX = (my / h - 0.5) * 2 * MAX;
                const rotY = (0.5 - mx / w) * 2 * MAX;
                card.style.transform =
                    `perspective(1100px) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
            }
        }
        // 用 requestAnimationFrame 節流：多個 pointermove 合併成每幀一次更新，避免卡頓
        card.addEventListener('pointermove', (e) => {
            const r = card.getBoundingClientRect();
            pending = { mx: e.clientX - r.left, my: e.clientY - r.top, w: r.width, h: r.height };
            if (!ticking){ ticking = true; requestAnimationFrame(apply); }
        });
        card.addEventListener('pointerleave', () => { card.style.transform = ''; });
    })();
    </script>
</body>
</html>
