<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <title>夢鄉</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #2E3163 0%, #5B6ABF 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 24px; padding: 48px; max-width: 600px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .logo { width: 80px; height: 80px; margin: 0 auto 24px; display: block; border-radius: 20px; }
        h1 { color: #333; margin-bottom: 8px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 32px; line-height: 1.6; }
        .lang-section { margin-bottom: 24px; }
        .lang-title { font-size: 14px; color: #999; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .link-row { display: flex; gap: 12px; }
        .link { flex: 1; display: block; padding: 16px 24px; background: #f5f6fb; border-radius: 12px; color: #5B6ABF; text-decoration: none; font-weight: 500; transition: all 0.2s; }
        .link:hover { background: #5B6ABF; color: white; transform: translateY(-2px); }
        .divider { height: 1px; background: #eee; margin: 24px 0; }
        .footer { color: #999; font-size: 14px; margin-top: 24px; }
        .footer a { color: #5B6ABF; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="assets/logo.png" alt="夢鄉">
        <h1>夢鄉</h1>
        <p class="subtitle">白噪音・哄睡音效・多軌混音<br>陪你與寶寶安穩入睡</p>

        <div class="links">
            <div class="link-row">
                <a href="privacy.html" class="link">🔒 隱私政策</a>
                <a href="terms.html" class="link">📋 使用條款</a>
            </div>
            <div class="link-row">
                <a href="support.html" class="link">💬 支援中心</a>
                <a href="mailto:sleepyland.feedback@gmail.com" class="link">✉️ 意見回饋</a>
            </div>
        </div>

        <div class="divider"></div>

        <!-- English -->
        <div class="lang-section">
            <div class="lang-title">🇺🇸 English</div>
            <div class="link-row">
                <a href="privacy-en.html" class="link">Privacy Policy</a>
                <a href="terms-en.html" class="link">Terms of Service</a>
            </div>
        </div>

        <p class="footer">© 2026 Wayne · <a href="mailto:sleepyland.feedback@gmail.com">Contact</a></p>
    </div>
</body>
</html>
