<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="夢鄉 Sleepyland 意見回饋：功能建議、問題回報或內容建議都歡迎告訴我們。">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <title>意見回饋 - 夢鄉</title>
<link rel="stylesheet" href="assets/site.css">
    <style id="pagecss">
        .langbtn{ position:absolute; top:16px; right:16px; z-index:5; margin-bottom:0; }
        .lib-name{ color:#eef4ff; font-weight:600; font-size:15px; }
        .faq-q{ font-weight:600; color:#eef4ff; margin-bottom:8px; }
        .contact-box h3{ color:#fff; margin-bottom:12px; }
        .contact-box .email-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
        .contact-box a.email-link{ display:inline-block; background:linear-gradient(180deg,#9AD0F2,#7BBDE8);
            color:#04182E; padding:12px 22px; border-radius:10px; text-decoration:none; font-weight:700;
            max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            box-shadow:0 6px 18px rgba(123,189,232,0.3); transition:transform .2s ease, box-shadow .2s ease; }
        .contact-box a.email-link:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(123,189,232,0.45); }
        .copy-btn svg{ width:20px; height:20px; fill:#EAF4FF; }
        .copy-btn.copied svg{ fill:#7BE0A0; }
        /* 意見回饋表單 */
        .fbform{ text-align:left; }
        .form-group{ margin-bottom:18px; }
        .form-group label{ display:block; font-size:13.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
        .req{ color:#F6D98A; }
        .field{ width:100%; padding:13px 15px; border-radius:12px; background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.12); color:var(--ink); font-size:15px; font-family:var(--font); line-height:1.6;
            transition:border-color .2s ease, background .2s ease; }
        .field::placeholder{ color:rgba(185,198,232,0.5); }
        .field:focus{ outline:none; border-color:rgba(140,195,235,0.55); background:rgba(255,255,255,0.08); }
        .field:disabled{ opacity:.5; }
        textarea.field{ min-height:130px; resize:vertical; }
        select.field{ appearance:none; -webkit-appearance:none;
            background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
            background-position:calc(100% - 20px) center,calc(100% - 15px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:40px; }
        select.field option{ background:#141026; color:#EAF4FF; }
        .form-section-label{ font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:26px 0 14px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08); }
        .form-group .switch{ display:inline-flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:0; }
        .switch input{ width:18px; height:18px; accent-color:#7BE0A0; margin:0; }
        .switch .sw-main{ color:var(--ink); font-size:14.5px; font-weight:600; line-height:1; }
        .switch-note{ color:var(--faint); font-size:11.5px; font-weight:500; margin:6px 0 0 28px; }
        .device-box{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:6px 16px; }
        .dev-row{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13.5px; }
        .dev-row:last-child{ border-bottom:none; }
        .dev-row span:first-child{ color:var(--faint); flex-shrink:0; }
        .dev-row span:last-child{ color:var(--muted); text-align:right; word-break:break-word; }
        .submit-btn{ flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:15px; border:none; border-radius:16px; cursor:pointer;
            background:linear-gradient(180deg,#FFB13C 0%,#FFCB46 55%,#FFE072 100%); color:#3A2600; font-weight:800; font-size:16.5px; font-family:var(--font);
            box-shadow:0 6px 22px rgba(255,168,60,0.40), inset 0 1px 0 rgba(255,255,255,0.5);
            transition:transform .18s ease, box-shadow .18s ease, opacity .2s ease; }
        .submit-btn:hover{ transform:translateY(-2px); box-shadow:0 2px 30px 4px rgba(255,168,60,0.55), inset 0 1px 0 rgba(255,255,255,0.5); }
        .btn-ico{ width:20px; height:20px; display:block; }
        .btn-row{ display:flex; gap:12px; align-items:stretch; margin-top:20px; }
        .clear-btn{ flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:15px 18px; border-radius:16px; cursor:pointer;
            background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:var(--muted); font-weight:700; font-size:15px; font-family:var(--font);
            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); transition:all .2s ease; }
        .clear-btn:hover{ background:rgba(255,255,255,0.1); color:var(--ink); transform:translateY(-2px); }
        .clear-btn img{ width:18px; height:18px; display:block; }
        .result-msg{ margin-top:16px; padding:0 16px; max-height:0; overflow:hidden; border-radius:12px; font-size:14.5px; opacity:0; transition:all .3s ease; }
        .result-msg.show{ max-height:140px; padding:14px 16px; opacity:1; }
        .result-msg.ok{ background:rgba(123,224,160,0.14); border:1px solid rgba(123,224,160,0.4); color:#c9f4da; }
        .result-msg.err{ background:rgba(255,120,120,0.14); border:1px solid rgba(255,120,120,0.4); color:#ffc9c9; }
    </style>
</head>
<body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="moon" aria-hidden="true"><img src="assets/moon.webp" alt="" fetchpriority="high" width="180" height="180"></div>
    <main class="container" id="swup">
        <button id="bgm-btn" class="bgm-btn" type="button" aria-label="播放背景音樂" title="播放背景音樂"><img class="bgm-ico-img" src="assets/icon_pause.png" alt=""></button>
        <div class="chead">
<a href="index.html" class="back-fab" aria-label="返回主頁" title="返回主頁"><img src="assets/icon_back.png" alt=""></a>
            <div class="header">
            <a class="logo-link" href="index.html" aria-label="回到首頁" title="回到首頁"><img class="logo" src="assets/logo.webp" alt="夢鄉"></a>
            <h1>意見回饋</h1>
            <p class="subtitle">你的每一則想法，都是夢鄉變得更好的養分。</p>
            </div>
        </div>
        <div class="cbody">
            <form id="fbForm" class="fbform" novalidate>
                <div class="form-group">
                    <label>回饋類型</label>
                    <select class="field" id="fbType">
                        <option>問題回報</option>
                        <option>功能建議</option>
                        <option>使用問題</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>回饋內容 <span class="req">*</span></label>
                    <textarea class="field" id="fbMsg" maxlength="1000" placeholder="" required></textarea>
                </div>

                <div class="form-section-label">回饋者資訊</div>
                <div class="form-group">
                    <label class="switch">
                        <input type="checkbox" id="fbAnon">
                        <span class="sw-main">匿名回饋</span>
                    </label>
                    <div class="switch-note">勾選後將不附帶你的暱稱</div>
                </div>
                <div class="form-group">
                    <label>暱稱（選填）</label>
                    <input class="field" id="fbNick" maxlength="40" placeholder="怎麼稱呼你">
                </div>
                <div class="form-group">
                    <label>性別</label>
                    <select class="field" id="fbGender">
                        <option value="未設定">未設定</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>聯絡 Email（選填，方便我們回覆你）</label>
                    <input class="field" id="fbEmail" type="email" maxlength="120" placeholder="you@example.com">
                </div>

                <div class="form-section-label">裝置資訊（自動附帶）</div>
                <div class="device-box">
                    <div class="dev-row"><span>瀏覽器</span><span id="devUA">—</span></div>
                    <div class="dev-row"><span>語系</span><span id="devLang">—</span></div>
                    <div class="dev-row"><span>時區</span><span id="devTz">—</span></div>
                    <div class="dev-row"><span>螢幕</span><span id="devScr">—</span></div>
                </div>

                <div class="btn-row">
                    <button type="button" class="clear-btn" id="fbClear"><img src="assets/icon_clear.png" alt="">清除欄位</button>
                    <button type="submit" class="submit-btn" id="fbSubmit"><img class="btn-ico" src="assets/icon_submit_dark.png" alt=""><span id="fbSubmitLabel">送出回饋</span></button>
                </div>
                <div class="result-msg" id="fbResult"></div>
            </form>
        </div>
        <button class="scrolltop" aria-label="回到頂部" title="回到頂部"><img src="assets/icon_scroll_top.png" alt=""></button>
    </main>

    <script>
    (function(){
        var TO='sleepyland.feedback@gmail.com';
        var form=document.getElementById('fbForm'); if(!form) return;
        var res=document.getElementById('fbResult');
        var anon=document.getElementById('fbAnon'), nick=document.getElementById('fbNick');
        var typeSel=document.getElementById('fbType'), msgEl=document.getElementById('fbMsg');
        function show(t,cls){ res.textContent=t; res.className='result-msg show '+cls; }

        var PH={'問題回報':'請詳細描述你所遇到的問題或錯誤，非常建議你附上畫面截圖','功能建議':'非常樂意聆聽你的想法','使用問題':'請大概說明一下你使用的過程中，面臨到的問題','其他':'歡迎給予 夢鄉 團隊任何回饋'};
        function updPH(){ msgEl.placeholder=PH[typeSel.value]||''; }
        typeSel.addEventListener('change', updPH); updPH();
        anon.addEventListener('change', function(){ nick.disabled=anon.checked; if(anon.checked) nick.value=''; });

        var DEV={ ua:navigator.userAgent, lang:navigator.language||'', tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'', scr:screen.width+'x'+screen.height };
        document.getElementById('devUA').textContent=DEV.ua;
        document.getElementById('devLang').textContent=DEV.lang||'—';
        document.getElementById('devTz').textContent=DEV.tz||'—';
        document.getElementById('devScr').textContent=DEV.scr;

        document.getElementById('fbClear').addEventListener('click', function(){
            form.reset(); nick.disabled=false; res.className='result-msg'; updPH();
        });

        form.addEventListener('submit', function(e){
            e.preventDefault();
            var msg=msgEl.value.trim();
            if(!msg){ show('請先填寫回饋內容','err'); return; }
            var isAnon=anon.checked;
            var who=isAnon?'匿名':(nick.value.trim()||'（未填暱稱）');
            var email=document.getElementById('fbEmail').value.trim();
            var gender=document.getElementById('fbGender').value;
            var subject='【網頁回饋】'+typeSel.value+' - '+who;
            var body=
                '【回饋類型】'+typeSel.value+'\n\n'+
                '【回饋內容】\n'+msg+'\n\n'+
                '【暱稱】'+who+'\n'+
                '【性別】'+gender+'\n'+
                '【聯絡 Email】'+(email||'未提供')+'\n\n'+
                '─────────────────\n'+
                '🌐 裝置資訊（自動附帶）\n'+
                '─────────────────\n'+
                '瀏覽器：'+DEV.ua+'\n'+
                '語系：'+DEV.lang+'\n'+
                '時區：'+DEV.tz+'\n'+
                '螢幕：'+DEV.scr+'\n'+
                '來源：網頁意見回饋頁';
            window.location.href='mailto:'+TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
            show('已為你開啟郵件視窗，內容都幫你填好了，確認後按「寄出」即可送給我們。','ok');
        });
    })();
    </script>

    <!-- 常駐背景音樂（換頁不中斷）-->
    <audio id="bgm-audio" src="assets/bgm.mp3" loop preload="none"></audio>
    <script src="assets/site.js" defer></script>
</body>
</html>
