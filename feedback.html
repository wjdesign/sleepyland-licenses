    <title>意見回饋 - 夢鄉</title>
    <style id="pagecss">
        /* ===== 共用基底 ===== */
        @font-face{font-family:'Google Sans Flex';font-style:normal;font-weight:100 900;font-display:swap;src:url('assets/gsf_latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

@font-face{font-family:'Noto Sans TC';font-style:normal;font-weight:700;font-display:swap;src:url('assets/notosanstc_700.woff2') format('woff2');unicode-range:U+2000-206F,U+3000-303F,U+3100-312F,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF;}
:root{
            --accent:#7BBDE8; --ink:#EAF4FF; --muted:#B9C6E8; --faint:#8291b6;
            --card:rgba(14,10,34,0.42); --line:rgba(255,255,255,0.14); --pill:rgba(255,255,255,0.06);
            --glow:rgba(255,244,190,0.55);
            --font:"Google Sans Flex","Noto Sans TC",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;
        }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; }
body, a, button, input, textarea{ font-family:var(--font); }
body{
            height:100dvh; color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.8;
            background:
                linear-gradient(180deg, rgba(3,2,9,0.40) 0%, rgba(10,6,26,0.32) 46%, rgba(20,12,50,0.46) 100%),
                #03020a url('assets/bg.webp') center center / cover no-repeat fixed;
            display:flex; align-items:center; justify-content:center; padding:40px 20px; overflow:hidden;
        }
/* 動畫層（星雲＋星星＋流星＋雲朵） */
        #sky{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
/* 月亮素材圖＋淡黃光暈 */
        .moon{ position:fixed; top:5vh; right:6vw; width:min(180px,26vw); z-index:0; pointer-events:none;
               filter:drop-shadow(0 0 34px var(--glow)); }
.moon img{ width:100%; height:auto; display:block; }
.moon::before{ content:''; position:absolute; inset:-95%; z-index:-1; border-radius:50%;
            background:radial-gradient(circle, rgba(255,247,205,0.36) 0%, rgba(255,243,185,0.18) 26%, rgba(255,240,175,0.07) 48%, rgba(255,240,175,0.02) 66%, transparent 82%);
            filter:blur(26px); animation:moonGlow 6s ease-in-out infinite; }
@keyframes moonGlow{ 0%,100%{opacity:.82; transform:scale(1);} 50%{opacity:1; transform:scale(1.07);} }
.container{
            position:relative; z-index:1; max-width:600px; width:100%;
            max-height:min(760px, calc(100dvh - 80px)); display:flex; flex-direction:column; overflow:hidden;
            background:linear-gradient(to bottom, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 40%), var(--card);
            backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
            border:1px solid var(--line); border-radius:24px;
            box-shadow:0 24px 70px rgba(4,2,16,0.6), inset 0 1px 1px rgba(255,255,255,0.18), inset 0 -22px 46px rgba(0,0,0,0.06);
        }
.container::after{ content:''; position:absolute; inset:0; z-index:6; pointer-events:none; border-radius:inherit; padding:1px;
            background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%), rgba(233,224,255,0.95), rgba(178,150,255,0.34) 42%, transparent 66%);
            -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
            opacity:0; transition:opacity .4s ease; }
.container:hover::after{ opacity:1; }
.chead{ flex:0 0 auto; padding:24px 40px 14px; position:relative; z-index:2; border-bottom:1px solid rgba(255,255,255,0.08); }
.chead .topbar{ margin-bottom:14px; }
.chead .header{ margin-bottom:6px; }
.chead .update-date{ margin-bottom:2px; }
.chead h1{ margin-bottom:6px; }
.cbody{ overflow-y:auto; min-height:0; padding:22px 40px 34px;
            scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.22) transparent; }
.cbody::-webkit-scrollbar{ width:8px; }
.cbody::-webkit-scrollbar-track{ background:transparent; margin:8px 0; }
.cbody::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
.cbody::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,0.34); background-clip:padding-box; }
.topbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
.back{ display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:11px;
            background:var(--pill); border:1px solid rgba(255,255,255,0.10); color:var(--ink);
            text-decoration:none; font-size:13.5px; font-weight:600; margin-bottom:6px;
            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
            transition:transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease; }
.back:hover{ transform:translateY(-2px); background:linear-gradient(to bottom, rgba(255,255,255,0.14), rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.28); box-shadow:0 8px 22px rgba(4,2,16,0.35); }
.bico{ width:15px; height:15px; vertical-align:-2px; }
.hico{ width:20px; height:20px; vertical-align:-4px; margin-right:6px; }
.back-fab{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
            background:var(--pill); border:1px solid rgba(255,255,255,0.10);
            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
            margin-left:-24px;   /* 左距與右上按鈕(right:16)對齊：chead padding-left 40 → 實際離卡片左緣 16 */
            transition:transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease; }
.back-fab img{ width:20px; height:20px; display:block; }
.scrolltop{ position:absolute; bottom:18px; right:18px; z-index:4; width:44px; height:44px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
            background:var(--pill); border:1px solid rgba(255,255,255,0.12);
            backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
            opacity:0; pointer-events:none; transform:translateY(8px);
            transition:opacity .25s ease, transform .25s ease, background .2s ease, border-color .2s ease; }
.scrolltop img{ width:20px; height:20px; display:block; }
.scrolltop.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
.scrolltop:hover{ transform:translateY(-2px); background:linear-gradient(to bottom, rgba(255,255,255,0.14), rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.28); box-shadow:0 8px 22px rgba(4,2,16,0.35); }
.back-fab:hover{ transform:translateY(-2px); background:linear-gradient(to bottom, rgba(255,255,255,0.14), rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.28); box-shadow:0 8px 22px rgba(4,2,16,0.35); }
.logo-link{ display:block; width:max-content; margin:0 auto; line-height:0; transition:transform .2s ease, filter .2s ease; }
.logo-link:hover{ transform:translateY(-2px); filter:brightness(1.08); }
.logo{ width:76px; height:76px; display:block; margin:0 auto 16px; border-radius:18px;
            border:1px solid rgb(64,24,251);
            box-shadow:0 10px 30px rgba(4,2,16,0.5), 0 0 22px rgba(123,189,232,0.22); }
.header{ text-align:center; margin-bottom:30px; }
h1{ font-size:27px; font-weight:800; color:#fff; margin-bottom:8px; text-align:center;
            text-shadow:0 2px 14px rgba(123,189,232,0.30); }
.subtitle{ color:var(--muted); text-align:center; font-size:15px; line-height:1.7; }
.update-date{ color:var(--faint); text-align:center; margin-bottom:28px; font-size:13.5px;
            text-transform:uppercase; letter-spacing:.06em; }
h2{ color:var(--accent); margin:28px 0 12px; font-size:18px; font-weight:700; }
h3{ color:#dbe6fb; margin:18px 0 8px; font-size:16px; font-weight:600; }
p, li{ color:var(--muted); line-height:1.85; margin-bottom:12px; font-size:15px; }
strong{ color:#F6D98A; font-weight:700; }
ul{ padding-left:22px; }
li{ margin-bottom:8px; }
a{ color:var(--accent); text-decoration:none; }
a:hover{ text-decoration:underline; }
.highlight{ background:rgba(123,189,232,0.10); border:1px solid rgba(123,189,232,0.22);
            padding:16px 18px; border-radius:14px; margin:18px 0; }
.highlight p{ margin:0; color:#dce8fb; }
.lib{ padding:14px 18px; background:var(--pill); border:1px solid rgba(255,255,255,0.08);
            border-radius:12px; margin-bottom:10px; }
.lib-meta{ color:var(--faint); font-size:13px; margin-top:4px; }
.lib-meta a{ color:var(--accent); }
.note{ color:var(--muted); font-size:14px; line-height:1.7; margin-top:6px; }
.divider{ height:1px; background:var(--line); margin:28px 0; }
.section{ margin-bottom:30px; }
.section-title{ font-size:18px; font-weight:700; color:#eef4ff; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.faq-item{ background:var(--pill); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:16px 18px; margin-bottom:12px; }
.faq-a{ color:var(--muted); line-height:1.75; font-size:14.5px; }
.contact-box{ background:linear-gradient(135deg, rgba(123,189,232,0.16), rgba(70,90,160,0.16));
            border:1px solid rgba(123,189,232,0.24); border-radius:16px; padding:24px; text-align:center;
            backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.contact-box p{ color:var(--muted); margin-bottom:16px; }
.copy-btn{ width:44px; min-width:44px; height:44px; aspect-ratio:1; border-radius:50%;
            background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.18); cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition:all .2s ease; flex-shrink:0; }
.copy-btn:hover{ transform:translateY(-2px); background:linear-gradient(to bottom, rgba(255,255,255,0.14), rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.28); box-shadow:0 8px 22px rgba(4,2,16,0.35); }
.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px);
            background:rgba(14,10,34,0.92); color:#EAF4FF; padding:12px 24px; border-radius:10px;
            border:1px solid rgba(255,255,255,0.14); backdrop-filter:blur(8px); opacity:0; transition:all .3s ease; z-index:5; }
.toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
.footer{ text-align:center; margin-top:30px; color:var(--faint); font-size:13px; }
.footer a{ color:var(--accent); text-decoration:none; }
.footer a:hover{ text-decoration:underline; }
@media (max-width:560px){ .chead{ padding:18px 20px 12px; } .cbody{ padding:18px 20px 30px; } body{ padding:16px; } .container{ max-height:calc(100dvh - 32px); border-radius:20px; } .back-fab{ margin-left:-4px; } }
@media (prefers-reduced-motion:reduce){ .back,.email-link,.copy-btn{ transition:none; } .moon::before{ animation:none; } }
        .bgm-btn{ position:absolute; top:72px; right:16px; z-index:5; width:48px; height:48px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
            background:var(--pill,rgba(255,255,255,0.06)); border:1px solid rgba(255,255,255,0.10);
            backdrop-filter:blur(6px) saturate(1.3); -webkit-backdrop-filter:blur(6px) saturate(1.3);
            box-shadow:0 8px 22px rgba(4,2,16,0.35); transition:transform .2s ease, background .2s ease, border-color .2s ease; }
        .bgm-btn:hover{ transform:translateY(-2px); background:linear-gradient(to bottom, rgba(255,255,255,0.14), rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.28); }
        .bgm-ico-img{ width:24px; height:24px; display:block; }
        /* ===== 本頁專屬 ===== */
        .langbtn{ position:absolute; top:16px; right:16px; z-index:5; margin-bottom:0; }
        .lib-name{ color:#eef4ff; font-weight:600; font-size:15px; }
        .faq-q{ font-weight:600; color:#eef4ff; margin-bottom:8px; }
        .contact-box h3{ color:#fff; margin-bottom:12px; }
        .contact-box .email-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
        .contact-box a.email-link{ display:inline-block; background:linear-gradient(180deg,#9AD0F2,#7BBDE8);

            box-shadow:0 6px 18px rgba(123,189,232,0.3); transition:transform .2s ease, box-shadow .2s ease; }
        .contact-box a.email-link:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(123,189,232,0.45); }
        .copy-btn svg{ width:20px; height:20px; fill:#EAF4FF; }
        .copy-btn.copied svg{ fill:#7BE0A0; }
        /* 意見回饋表單 */
        .fbform{ text-align:left; }
        .form-group{ margin-bottom:18px; }
        .form-group label{ display:block; font-size:13.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
        .req{ color:#F6D98A; }
        .field{ width:100%; padding:13px 15px; border-radius:12px; background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.12); color:var(--ink); font-size:15px; font-family:var(--font); line-height:1.6;
            transition:border-color .2s ease, background .2s ease; }
        .field::placeholder{ color:rgba(185,198,232,0.5); }
        .field:focus{ outline:none; border-color:rgba(140,195,235,0.55); background:rgba(255,255,255,0.08); }
        .field:disabled{ opacity:.5; }
        textarea.field{ min-height:130px; resize:vertical; }
        select.field{ appearance:none; -webkit-appearance:none;
            background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
            background-position:calc(100% - 20px) center,calc(100% - 15px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:40px; }
        select.field option{ background:#141026; color:#EAF4FF; }
        .form-section-label{ font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:26px 0 14px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08); }
        .form-group .switch{ display:inline-flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:0; }
        .switch input{ width:18px; height:18px; accent-color:#7BE0A0; margin:0; }
        .switch .sw-main{ color:var(--ink); font-size:14.5px; font-weight:600; line-height:1; }

            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); transition:all .2s ease; }

<body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="moon" aria-hidden="true"><img src="assets/moon.webp" alt="" fetchpriority="high" width="180" height="180"></div>
    <main class="container" id="swup">
        <button id="bgm-btn" class="bgm-btn" type="button" aria-label="播放背景音樂" title="播放背景音樂"><img class="bgm-ico-img" src="assets/icon_pause.png" alt=""></button>
        <div class="chead">
<a href="index.html" class="back-fab" aria-label="返回主頁" title="返回主頁"><img src="assets/icon_back.png" alt=""></a>
            <a href="feedback.html" class="contact-fab" aria-label="意見回饋" title="意見回饋"><img src="assets/icon_connect.png" alt=""></a>
            <div class="header">
            <a class="logo-link" href="index.html" aria-label="回到首頁" title="回到首頁"><img class="logo" src="assets/logo.webp" alt="夢鄉"></a>
            <h1>意見回饋</h1>
            <p class="subtitle">你的每一則想法，都是夢鄉變得更好的養分。</p>
            </div>
        </div>
        <div class="cbody">
            <form id="fbForm" class="fbform" novalidate>
                <div class="form-group">
                    <label>回饋類型</label>
                    <select class="field" id="fbType">
                        <option>問題回報</option>
                        <option>功能建議</option>
                        <option>使用問題</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>回饋內容 <span class="req">*</span></label>
                    <textarea class="field" id="fbMsg" maxlength="1000" placeholder="" required></textarea>
                </div>

                <div class="form-section-label">回饋者資訊</div>
                <div class="form-group">
                    <label class="switch">
                        <input type="checkbox" id="fbAnon">
                        <span class="sw-main">匿名回饋</span>
                    </label>
                    <div class="switch-note">勾選後將不附帶你的暱稱</div>
                </div>
                <div class="form-group">
                    <label>暱稱（選填）</label>
                    <input class="field" id="fbNick" maxlength="40" placeholder="怎麼稱呼你">
                </div>
                <div class="form-group">
                    <label>性別</label>
                    <select class="field" id="fbGender">
                        <option value="未設定">未設定</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>聯絡 Email（選填，方便我們回覆你）</label>
                    <input class="field" id="fbEmail" type="email" maxlength="120" placeholder="you@example.com">
                </div>

                <div class="form-section-label">裝置資訊（自動附帶）</div>
                <div class="device-box">
                    <div class="dev-row"><span>瀏覽器</span><span id="devUA">—</span></div>
                    <div class="dev-row"><span>語系</span><span id="devLang">—</span></div>
                    <div class="dev-row"><span>時區</span><span id="devTz">—</span></div>
                    <div class="dev-row"><span>螢幕</span><span id="devScr">—</span></div>
                </div>

                <div class="btn-row">
                    <button type="button" class="clear-btn" id="fbClear"><img src="assets/icon_clear.png" alt="">清除欄位</button>
                    <button type="submit" class="submit-btn" id="fbSubmit"><img class="btn-ico" src="assets/icon_submit_dark.png" alt=""><span id="fbSubmitLabel">送出回饋</span></button>
                </div>
                <div class="result-msg" id="fbResult"></div>
            </form>
        </div>
        <button class="scrolltop" aria-label="回到頂部" title="回到頂部"><img src="assets/icon_scroll_top.png" alt=""></button>
    </main>

    <script>
    (function(){
        var TO='sleepyland.feedback@gmail.com';
        var form=document.getElementById('fbForm'); if(!form) return;
        var res=document.getElementById('fbResult');
        var anon=document.getElementById('fbAnon'), nick=document.getElementById('fbNick');
        var typeSel=document.getElementById('fbType'), msgEl=document.getElementById('fbMsg');
        function show(t,cls){ res.textContent=t; res.className='result-msg show '+cls; }

        var PH={'問題回報':'請詳細描述你所遇到的問題或錯誤，非常建議你附上畫面截圖','功能建議':'非常樂意聆聽你的想法','使用問題':'請大概說明一下你使用的過程中，面臨到的問題','其他':'歡迎給予 夢鄉 團隊任何回饋'};
        function updPH(){ msgEl.placeholder=PH[typeSel.value]||''; }
        typeSel.addEventListener('change', updPH); updPH();
        anon.addEventListener('change', function(){ nick.disabled=anon.checked; if(anon.checked) nick.value=''; });

        var DEV={ ua:navigator.userAgent, lang:navigator.language||'', tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'', scr:screen.width+'x'+screen.height };
        document.getElementById('devUA').textContent=DEV.ua;
        document.getElementById('devLang').textContent=DEV.lang||'—';
        document.getElementById('devTz').textContent=DEV.tz||'—';
        document.getElementById('devScr').textContent=DEV.scr;

        document.getElementById('fbClear').addEventListener('click', function(){
            form.reset(); nick.disabled=false; res.className='result-msg'; updPH();
        });

        form.addEventListener('submit', function(e){
            e.preventDefault();
            var msg=msgEl.value.trim();
            if(!msg){ show('請先填寫回饋內容','err'); return; }
            var isAnon=anon.checked;
            var who=isAnon?'匿名':(nick.value.trim()||'（未填暱稱）');
            var email=document.getElementById('fbEmail').value.trim();
            var gender=document.getElementById('fbGender').value;
            var subject='【網頁回饋】'+typeSel.value+' - '+who;
            var body=
                '【回饋類型】'+typeSel.value+'\n\n'+
                '【回饋內容】\n'+msg+'\n\n'+
                '【暱稱】'+who+'\n'+
                '【性別】'+gender+'\n'+
                '【聯絡 Email】'+(email||'未提供')+'\n\n'+
                '─────────────────\n'+
                '🌐 裝置資訊（自動附帶）\n'+
                '─────────────────\n'+
                '瀏覽器：'+DEV.ua+'\n'+
                '語系：'+DEV.lang+'\n'+
                '時區：'+DEV.tz+'\n'+
                '螢幕：'+DEV.scr+'\n'+
                '來源：網頁意見回饋頁';
            window.location.href='mailto:'+TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
            show('已為你開啟郵件視窗，內容都幫你填好了，確認後按「寄出」即可送給我們。','ok');
        });
    })();
    </script>

    <!-- 常駐背景音樂（換頁不中斷）-->
    <audio id="bgm-audio" src="assets/bgm.mp3" loop preload="none"></audio>
    <script src="assets/site.js" defer></script>
</body>
</html>
